<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Meu Gerente</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint, pra não piscar claro e depois escurecer.
      try {
        var tema = localStorage.getItem("meugerente-theme");
        if (tema === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
